# Secrets come from the environment or from a .env file next to this one; copy .env.example
# to .env and fill it in. Every server refuses to start while a secret is unset.
services:
  db:
    container_name: noscore-db
    image: postgres:17.2-alpine3.21
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD, see .env.example}
      - POSTGRES_DB=noscore
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d noscore"]
      interval: 5s
      timeout: 3s
      retries: 12
    # Reachable from this machine only, for running a server or the parser outside Docker.
    ports:
      - 127.0.0.1:5432:5432
    # PG17 cannot read a PG12 data directory. A dedicated path forces a clean
    # init on upgrade — existing developers just rename ./postgres out of the
    # way (or dump+restore) and let PG17 initialise ./postgres17 from scratch.
    volumes:
      - ./postgres17:/var/lib/postgresql/data
    networks:
      - noscore-network

  reverse-proxy:
    container_name: noscore-reverse-proxy
    image: noscoreio/noscore.reverseproxy:latest
    profiles:
      - proxy
    restart: unless-stopped
    ports:
      - 4000:4000
      - 1337:1337
    expose:
      - 4000
      - 1337
    networks:
      - noscore-network

  master:
    container_name: noscore-master
    depends_on:
      db:
        condition: service_healthy
    environment:
      - PORT=5000
      - DB_HOST=db
      - WEBAPI_HOST=http://master
      - DB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD, see .env.example}
      - MASTER_PASSWORD=${MASTER_PASSWORD:?Set MASTER_PASSWORD, see .env.example}
    build:
      context: ./
      dockerfile: deploy/Dockerfile
      target: master
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:5000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    ports:
      - 5000:5000
    networks:
      - noscore-network
    volumes:
      - ./configuration/:/app/configuration

  world:
    container_name: noscore-world
    depends_on:
      db:
        condition: service_healthy
      master:
        condition: service_healthy
    environment:
      - WEBAPI_PORT=5001
      - WEBAPI_HOST=http://world
      - WORLD_PORT=1337
      - MASTER_HOST=http://master
      - DB_HOST=db
      - HOST=127.0.0.1
      - DB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD, see .env.example}
      - MASTER_PASSWORD=${MASTER_PASSWORD:?Set MASTER_PASSWORD, see .env.example}
    build:
      context: ./
      dockerfile: deploy/Dockerfile
      target: world
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 1337"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    ports:
      - 5001:5001
      - 1337:1337
    networks:
      - noscore-network
    volumes:
      - ./configuration/:/app/configuration

  login:
    container_name: noscore-login
    depends_on:
      db:
        condition: service_healthy
      master:
        condition: service_healthy
    environment:
      - LOGIN_PORT=4000
      - MASTER_HOST=http://master
      - DB_HOST=db
      - HOST=127.0.0.1
      - DB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD, see .env.example}
      - MASTER_PASSWORD=${MASTER_PASSWORD:?Set MASTER_PASSWORD, see .env.example}
    build:
      context: ./
      dockerfile: deploy/Dockerfile
      target: login
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 4000"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    ports:
      - 4000:4000
    networks:
      - noscore-network
    volumes:
      - ./configuration/:/app/configuration

  parser:
    container_name: noscore-parser
    profiles:
      - tools
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD, see .env.example}
    build:
      context: ./
      dockerfile: deploy/Dockerfile
      target: parser
    networks:
      - noscore-network
    volumes:
      - ./configuration/:/app/configuration
      - ./dats:/dats

networks:
  noscore-network:
    driver: bridge
