services:
  db:
    container_name: noscore-db
    image: postgres:17.2-alpine3.21
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=noscore
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d noscore"]
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - 5432:5432
    # PG17 cannot read a PG12 data directory. A dedicated path forces a clean
    # init on upgrade — existing developers just rename ./postgres out of the
    # way (or dump+restore) and let PG17 initialise ./postgres17 from scratch.
    volumes:
      - ./postgres17:/var/lib/postgresql/data
    networks:
      - noscore-network

  reverse-proxy:
    container_name: noscore-reverse-proxy
    image: noscoreio/noscore.reverseproxy:latest
    profiles:
      - proxy
    restart: unless-stopped
    ports:
      - 4000:4000
      - 1337:1337
    expose:
      - 4000
      - 1337
    networks:
      - noscore-network

  master:
    container_name: noscore-master
    depends_on:
      db:
        condition: service_healthy
    environment:
      - PORT=5000
      - DB_HOST=db
      - WEBAPI_HOST=http://master
    build:
      context: ./
      dockerfile: deploy/Dockerfile-master
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:5000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    ports:
      - 5000:5000
    networks:
      - noscore-network
    volumes:
      - ./build/net10.0/linux-musl-x64:/app/build/net10.0
      - ./configuration/:/app/build/configuration

  world:
    container_name: noscore-world
    depends_on:
      db:
        condition: service_healthy
      master:
        condition: service_healthy
    environment:
      - WEBAPI_PORT=5001
      - WEBAPI_HOST=http://world
      - WORLD_PORT=1337
      - MASTER_HOST=http://master
      - DB_HOST=db
      - HOST=127.0.0.1
    build:
      context: ./
      dockerfile: deploy/Dockerfile-world
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 1337"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    ports:
      - 5001:5001
      - 1337:1337
    networks:
      - noscore-network
    volumes:
      - ./build/net10.0/linux-musl-x64:/app/build/net10.0
      - ./configuration/:/app/build/configuration

  login:
    container_name: noscore-login
    depends_on:
      db:
        condition: service_healthy
      master:
        condition: service_healthy
    environment:
      - LOGIN_PORT=4000
      - MASTER_HOST=http://master
      - DB_HOST=db
      - HOST=127.0.0.1
    build:
      context: ./
      dockerfile: deploy/Dockerfile-login
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 4000"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    ports:
      - 4000:4000
    networks:
      - noscore-network
    volumes:
      - ./build/net10.0/linux-musl-x64:/app/build/net10.0
      - ./configuration/:/app/build/configuration

networks:
  noscore-network:
    driver: bridge
