name: Sibling packages at head

# Builds and tests NosCore against the master branch of every sibling package, each sibling built
# against the others' heads too, so a breaking change shows up before it is released.
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/siblings-head.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HEAD_VERSION: 999.0.0
      NOSCORE_LOCAL_PACKAGES: ${{ github.workspace }}/local-packages
    steps:
    - uses: actions/checkout@v7
      with:
        path: NosCore
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 11.0.x

    - name: Clone every sibling at head
      run: |
        for name in Analyzers Shared Dao Packets Algorithm PathFinder Networking; do
          git clone --depth 1 "https://github.com/NosCoreIO/NosCore.$name" "NosCore.$name"
        done

    # A package compiled against an older major of another runs against the newer one without a
    # build noticing, so a reference may trail the latest release by one major at most.
    - name: No reference is more than one major behind
      run: |
        set -o pipefail
        behind=0
        for name in Analyzers Shared Dao Packets Algorithm PathFinder Networking; do
          latest=$(curl -fsS "https://api.nuget.org/v3-flatcontainer/noscore.${name,,}/index.json" \
            | jq -r '[.versions[] | select(test("-") | not)] | last')
          if ! [[ "$latest" =~ ^[0-9]+\. ]]; then
            echo "::error::No release of NosCore.$name found on nuget.org"
            exit 1
          fi
          while IFS=: read -r file reference; do
            used=$(sed -E 's/.*Version="([0-9]+).*/\1/' <<< "$reference")
            if [ $(( ${latest%%.*} - used )) -gt 1 ]; then
              echo "::error file=$file::$file references NosCore.$name $used.x; the latest release is $latest"
              behind=1
            fi
          done < <(grep -rHoE --include='*.csproj' --include='*.props' \
              "Include=\"NosCore\.$name\" Version=\"[0-9]+[^\"]*\"" NosCore NosCore.{Analyzers,Shared,Dao,Packets,Algorithm,PathFinder,Networking})
        done
        exit $behind

    - name: Pack every sibling at head
      run: |
        mkdir -p "$NOSCORE_LOCAL_PACKAGES"
        # Runtime dependencies before their consumers. The analyzers are left at each sibling's own
        # version there: they decide that repository's warnings, not what runs together.
        packed=()
        for name in Analyzers Shared Dao Packets Algorithm PathFinder Networking; do
          for dependency in "${packed[@]}"; do
            find "NosCore.$name" -name '*.csproj' -exec \
              sed -i -E "s#(Include=\"NosCore\.$dependency\" Version=)\"[^\"]*\"#\1\"$HEAD_VERSION\"#" {} +
          done
          (cd "NosCore.$name" && dotnet build -c Release && dotnet pack -c Release --no-build -o "$NOSCORE_LOCAL_PACKAGES" -p:PackageVersion="$HEAD_VERSION")
          [ "$name" = Analyzers ] || packed+=("$name")
        done
        sed -i -E "s#(Include=\"NosCore\.(Analyzers|Shared|Dao|Packets|Algorithm|PathFinder|Networking)\" Version=)\"[^\"]*\"#\1\"$HEAD_VERSION\"#" \
          NosCore/Directory.Packages.props
        git -C NosCore diff

    - name: Build
      working-directory: NosCore
      run: dotnet build

    - name: Test
      working-directory: NosCore
      env:
        NOSCORE_E2E_REQUIRED: true
      run: dotnet test --no-build --filter TestCategory!=OPTIONAL-TEST
