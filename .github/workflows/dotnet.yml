name: .NET

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow, github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Each lane builds only what its tests need, so the slow end-to-end run starts with the others
  # instead of after them.
  tests:
    name: tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project:
          - NosCore.Core.Tests
          - NosCore.Database.Tests
          - NosCore.GameObject.Tests
          - NosCore.Instances.Tests
          - NosCore.PacketHandlers.Tests
          - NosCore.Parser.Tests
          - NosCore.Persistence.Tests
          - NosCore.Tests.Shared
          - NosCore.WebApi.Tests
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 11.0.x

    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
        restore-keys: |
          nuget-${{ runner.os }}-

    - name: Build
      run: dotnet build test/${{ matrix.project }}/${{ matrix.project }}.csproj

    - name: Test
      env:
        NOSCORE_E2E_REQUIRED: true
      run: >-
        dotnet test test/${{ matrix.project }}/${{ matrix.project }}.csproj --no-build
        --filter TestCategory!=OPTIONAL-TEST --logger GitHubActions
        /p:CollectCoverage=true /p:CoverletOutputFormat=opencover /p:ExcludeByAttribute='GeneratedCodeAttribute' /p:ExcludeByAttribute='Obsolete' /p:ExcludeByAttribute='CompilerGeneratedAttribute' /p:CoverletOutput="${{ github.workspace }}/coverage/${{ matrix.project }}.opencover.xml"

    - name: Upload coverage to Codecov
      if: always()
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        directory: coverage
        flags: ${{ matrix.project }}

  end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 11.0.x

    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
        restore-keys: |
          nuget-${{ runner.os }}-

    - name: Build
      run: dotnet build

    - name: Run end-to-end scenarios
      env:
        NOSCORE_E2E_REQUIRED: true
      run: dotnet test test/NosCore.EndToEnd.Tests/NosCore.EndToEnd.Tests.csproj --no-build --logger GitHubActions

  docker:
    if: github.ref == 'refs/heads/master'
    needs: [tests, end-to-end]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to DockerHub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build, tag, and push image LoginServer
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./deploy/Dockerfile
        target: login
        push: true
        tags: |
          noscoreio/noscore.loginserver:latest
          noscoreio/noscore.loginserver:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build, tag, and push image MasterServer
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./deploy/Dockerfile
        target: master
        push: true
        tags: |
          noscoreio/noscore.masterserver:latest
          noscoreio/noscore.masterserver:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build, tag, and push image Parser
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./deploy/Dockerfile
        target: parser
        push: true
        tags: |
          noscoreio/noscore.parser:latest
          noscoreio/noscore.parser:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build, tag, and push image WorldServer
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./deploy/Dockerfile
        target: world
        push: true
        tags: |
          noscoreio/noscore.worldserver:latest
          noscoreio/noscore.worldserver:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
