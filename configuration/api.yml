MasterCommunication:
  Password: ${MASTER_PASSWORD,CHANGE_ME}
  Host: ${MASTER_HOST,http://localhost}
  Port: 5000
Host: ${HOST,127.0.0.1}
Port: ${API_PORT,8080}
Language: en
Database:
  Host: ${DB_HOST,localhost}
  Port: 5432
  Database: noscore
  Username: ${DB_USER,postgres}
  Password: ${DB_PASSWORD,CHANGE_ME}
Messaging:
  Transport: ${MESSAGING_TRANSPORT,Postgresql}
  PollingIntervalMs: 20
  RabbitMqUri: ${RABBITMQ_URI,amqp://CHANGE_ME:CHANGE_ME@localhost:5672}
Jwt:
  SigningKey: ${JWT_SIGNING_KEY,CHANGE_ME}
Mall:
  SignatureKey: ${MALL_SIGNATURE_KEY,CHANGE_ME}
# Only these addresses may set X-Forwarded-For. Leave both empty when clients connect directly.
ForwardedHeaders:
  KnownProxies: []
  KnownNetworks: []
